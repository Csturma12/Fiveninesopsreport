# Fly.io configuration for Five Nines Operations Platform & Compact Gmail Toolkit (v2)
#
# First-time setup (creates a brand-new Fly app without touching primary-freight-dashboard):
#   1. flyctl apps create fivenines-ops
#   2. flyctl secrets set -a fivenines-ops \
#        SUPABASE_URL="https://nonqwidfqrklksjluloz.supabase.co" \
#        SUPABASE_SERVICE_ROLE_KEY="..." \
#        GOOGLE_CLIENT_ID="..." \
#        GOOGLE_CLIENT_SECRET="..." \
#        SESSION_SECRET="..." \
#        OPS_GATEWAY_TOKEN="..." \
#        PFD_BASE_URL="http://primary-freight-dashboard.internal:5000" \
#        ALLOW_LIVE_TAI_WRITES="true" \
#        TAI_WRITEBACK_POLLER_ENABLED="true"
#      (fivenines-ops claims & processes its own queued writes immediately on save
#       via runPollerForAssignmentId and re-checks parked awaitingReadBack rows on its 15s tick;
#       set TAI_WRITEBACK_POLLER_SCOPE="all" when retiring the legacy app.)
#   3. flyctl deploy -a fivenines-ops

app = "fivenines-ops"
primary_region = "dfw"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_BASE_URL = "https://fivenines-ops.fly.dev"
  GMAIL_FREIGHT_TOOLKIT_OAUTH_CLIENT_IDS = "1093823548746-u96k7b3qro0a2vs6g5m1b9hfbn3441be.apps.googleusercontent.com,413556084944-jp47ckqu854t3cpccu318eqmn8c5ck50.apps.googleusercontent.com"
  TAI_WRITEBACK_ENABLED = "true"
  BILLING_TAI_WRITE_ENABLED = "true"
  TAI_ADDRESS_BOOK_SAVE_ENABLED = "false"
  TAI_WRITEBACK_POLLER_ENABLED = "true"
  TAI_WRITEBACK_POLLER_SCOPE = "own"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory_mb = 512
