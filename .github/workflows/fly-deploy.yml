name: Verify & Deploy to Fly (fivenines-ops)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  deploy:
    name: Deploy to Fly.io
    needs: verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via WIF
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/135727430593/locations/global/workloadIdentityPools/swarm-fivenines-agent/providers/github-actions
          service_account: fivenines-ops-report@agents-514607.iam.gserviceaccount.com

      - name: Fetch FLY_API_TOKEN from Secret Manager
        id: secrets
        uses: google-github-actions/get-secretmanager-secrets@v2
        with:
          secrets: |-
            FLY_API_TOKEN:agents-514607/FLY_API_TOKEN
          export_to_environment: true

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ steps.secrets.outputs.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only
