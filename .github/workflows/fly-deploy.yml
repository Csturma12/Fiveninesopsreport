name: Verify & Deploy to Fly (fivenines-ops)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  deploy:
    name: Deploy to Fly.io (if FLY_API_TOKEN configured)
    needs: verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Check if FLY_API_TOKEN is set
        id: check_secret
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "FLY_API_TOKEN secret not configured yet — skipping automatic Fly deploy."
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check_secret.outputs.has_token == 'true'
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.check_secret.outputs.has_token == 'true'
      - run: flyctl deploy --remote-only
        if: steps.check_secret.outputs.has_token == 'true'
